name: Auto-merge bot

# Merges every non-draft pull request automatically, without waiting for CI.
# To disable the bot, delete this file from the default branch.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Retry a few times: GitHub may still be computing mergeability
          # right after the PR event fires.
          for attempt in 1 2 3 4 5; do
            if gh pr merge --merge "$PR_URL"; then
              echo "Merged $PR_URL"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 20s..."
            sleep 20
          done
          gh pr comment "$PR_URL" --body "🤖 Auto-merge bot: could not merge this PR automatically (most likely a merge conflict with main). Please update the branch and resolve conflicts."
          exit 1
