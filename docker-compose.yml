# docker-compose.yml — Development (hot-reload)
#
# Usage:
#   docker compose up
#
# Frontend: http://localhost:3000
# Backend:  http://localhost:4000
#
# Local Stellar network (optional, off by default):
#   docker compose --profile localnet up stellar
#   Horizon:     http://localhost:8000
#   Soroban RPC: http://localhost:8000/rpc
#   Friendbot:   http://localhost:8000/friendbot
#   See contracts/stellar-micropay-contract/README.md ("Local network").
#
# For production:
#   docker compose -f docker-compose.prod.yml up

version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - STELLAR_NETWORK=testnet
      - HORIZON_URL=https://horizon-testnet.stellar.org
      - ALLOWED_ORIGINS=http://localhost:3000
      # Dev-only placeholder so the stack boots without local secrets.
      # The backend refuses to start without JWT_SECRET (src/middleware/auth.js).
      - JWT_SECRET=dev-only-insecure-jwt-secret-change-me
      - REDIS_URL=redis://redis:6379
      - ANALYTICS_CACHE_TTL_MS=300000
    depends_on:
      redis:
        condition: service_started
    volumes:
      # Mount source for hot-reload via nodemon
      - ./backend:/app
      # Preserve container's node_modules
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_STELLAR_NETWORK=testnet
      - NEXT_PUBLIC_HORIZON_URL=https://horizon-testnet.stellar.org
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      # Enable polling so file-watch works on all host OSes (Linux/macOS/Windows)
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # Mount source for hot-reload via Next.js HMR
      - ./frontend:/app
      # Preserve container's node_modules and Next.js build cache
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Standalone Stellar network with Horizon, Soroban RPC and Friendbot.
  # Only started with `--profile localnet` so the default stack is unchanged.
  stellar:
    image: stellar/quickstart:latest
    profiles: ["localnet"]
    command: ["--local", "--enable-soroban-rpc"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/friendbot"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  redis_data:
